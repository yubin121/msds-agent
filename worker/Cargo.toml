[package]
name = "msds-worker"
version = "0.1.0"
edition = "2021"

# 메인 크레이트와 따로 빌드한다 (worker-build, wrangler dev)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
msds-validate = { path = "../msds-validate" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
