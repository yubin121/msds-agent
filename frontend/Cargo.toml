[package]
name = "msds-frontend"
version = "0.1.0"
edition = "2021"

# 메인 크레이트와 따로 빌드한다 (trunk serve)
[workspace]

[dependencies]
yew = { version = "=0.21.0", features = ["csr"] }
yew-router = "=0.18.0"
gloo-net = { version = "=0.6.0", default-features = false, features = ["http", "json"] }
gloo-timers = "=0.3.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["File", "FileList", "FormData", "HtmlInputElement"] }
serde = { version = "1", features = ["derive"] }
