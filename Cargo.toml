[package]
name = "msds-agent"
version = "0.1.0"
edition = "2021"

# 서버와 검사 규칙 크레이트를 함께 테스트한다(cargo test --workspace). worker·frontend는 각자 독립 workspace
[workspace]
members = [".", "msds-validate"]

[dependencies]
pekko-actor       = { path = "../rust-pekko/pekko-actor" }
pekko-agent-core  = { path = "../pekko-agent/crates/pekko-agent-core" }
pekko-agent-tools = { path = "../pekko-agent/crates/pekko-agent-tools" }
pekko-agent-llm   = { path = "../pekko-agent/crates/pekko-agent-llm" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
pdf-extract = "0.12"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
encoding_rs = "0.8"
regex = "1"
base64 = "=0.22.1"
msds-validate = { path = "msds-validate" }
